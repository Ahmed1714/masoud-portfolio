name: Build Masoud Hub APK

on:
  push:
    paths:
      - 'masoud-hub/**'
      - '.github/workflows/masoud-hub-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masoud-hub
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masoud-hub/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install & build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: masoud-hub/android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk MasoudHub.apk

      - uses: actions/upload-artifact@v5
        with:
          name: masoud-hub-apk
          path: masoud-hub/MasoudHub.apk

      # Publishes a direct download link: /releases/latest/download/MasoudHub.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: masoud-hub-latest
          name: Masoud Hub (آخر نسخة)
          body: |
            حمّل **MasoudHub.apk** من تحت وسطّبه على الموبايل.
            Build #${{ github.run_number }} — ${{ github.sha }}
          make_latest: true
          files: masoud-hub/MasoudHub.apk
