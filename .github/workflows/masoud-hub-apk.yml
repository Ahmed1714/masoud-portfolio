name: Build Masoud Hub APK

on:
  push:
    paths:
      - 'masoud-hub/**'
      - '.github/workflows/masoud-hub-apk.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: masoud-hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: masoud-hub/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install & build web app
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build APK
        working-directory: masoud-hub/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: masoud-hub-apk
          path: masoud-hub/android/app/build/outputs/apk/debug/app-debug.apk
